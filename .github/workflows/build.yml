name: Java CI with Maven

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package
    - name: Publish coverage report to Coveralls
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        CI_NAME: github
        CI_BUILD_NUMBER: ${{ github.run_id }}
        CI_BUILD_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        CI_BRANCH: ${{ github.head_ref || github.ref_name }}
        CI_PULL_REQUEST: ${{ github.event.pull_request.number }}
      run: mvn -B jacoco:report coveralls:report -DrepoToken=$COVERALLS_REPO_TOKEN
    - name: Publish analysis to SonarCloud
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: mvn -B jacoco:report org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
