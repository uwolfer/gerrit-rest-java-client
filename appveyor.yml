install:
  - ps: |
      $jdk = Get-ChildItem 'C:\Program Files\Java' -Directory |
        Where-Object { $_.Name -match '^jdk-?(\d+)' -and [int]$Matches[1] -ge 11 } |
        Sort-Object { [int]([regex]::Match($_.Name, '\d+').Value) } |
        Select-Object -First 1
      if (-not $jdk) {
          throw "No JDK 11+ found under 'C:\Program Files\Java'"
      }
      Write-Host "Using $($jdk.FullName) as JAVA_HOME"
      $env:JAVA_HOME = $jdk.FullName
      $env:PATH = "$($jdk.FullName)\bin;$env:PATH"
  - java -version

cache:
  - C:\Users\appveyor\.m2\ -> pom.xml

build_script:
  - mvn install -DskipTests=true -Dmaven.javadoc.skip=true -B -V  # This is what Travis CI does by default.

test_script:
  - mvn test -B  # This is what Travis CI does by default.

after_test:
  - ps: |
      $url = "https://ci.appveyor.com/api/testresults/junit/$($env:APPVEYOR_JOB_ID)"
      $files = Get-ChildItem '.\target\surefire-reports\junitreports\TEST-*.xml'
      ForEach ($file in $files) {
          (New-Object 'System.Net.WebClient').UploadFile($url, (Resolve-Path $file))
      }

artifacts:
  - path: target\*.jar
    name: Java archive
